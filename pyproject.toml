[project]
name = "ai-assist"
version = "1.0.0"
description = "Source for AI-ASSIST model building."
authors = [
  { name = "Gregor Cerar", email = "gregor.cerar@ijs.si" },
  { name = "Denis Sodin", email = "denis.sodin@ijs.si" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
  "pandas[performance,output-formatting,computation,parquet,compression] ~=3.0.0",
  "numpy",
  "scipy",

  "fastapi[standard]",
  "pydantic",
  "pydantic-extra-types",
  "pydantic-settings",

  "matplotlib ~=3.10.0",
  "seaborn ~=0.13.2",
  "plotly ~=6.5.0",

  "scikit-learn ~=1.8.0",
  # "xgboost-cpu ~=3.1.1",
  # "scikit-learn-intelex ~=2025.11.0",

  "jupyterlab ~=4.5.0",
  "nbconvert ~=7.16.6",

  "ipywidgets ~=8.1.5",
  "shap ~=0.51.0",
  "networkx ~=3.6.0",
  "openpyxl",

  "ruff",
  "dvc",
  "qdrant-client[fastembed] ~=1.17.0",
  "pre-commit",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.uv]
exclude-newer = "2 weeks"

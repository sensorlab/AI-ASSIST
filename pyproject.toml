[project]
name = "ai-assist"
version = "1.0.0"
description = "Source for AI-ASSIST model building."
authors = [
  { name = "Gregor Cerar", email = "gregor.cerar@ijs.si" },
  { name = "Denis Sodin", email = "denis.sodin@ijs.si" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
  "pandas[performance, output-formatting, computation, parquet, compression] ~=2.2.3",
  "numpy",
  "scipy",

  "matplotlib ~=3.10.0",
  "seaborn ~=0.13.2",
  "plotly ~=5.24.1",

  "scikit-learn ~=1.6.1",
  "scikit-learn-intelex ~=2025.2.0",

  "jupyterlab ~=4.3.4",
  "ipython <9.0.0",
  "nbconvert ~=7.16.6",

  "ipywidgets ~=8.1.5",
  "shap ~=0.47.0",
  "networkx ~=3.4.2"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
